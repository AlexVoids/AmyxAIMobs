  piglin: 11
  piglinbrute: 0
  blaze: 7
  ghast: 4
  magmacube: 8
  witherskeleton: 6
  hoglin: 9
  zoglin: 0
  strider: 0

  shulker: 0
  endermite: 0
# Максимальное расстояние до ближайшего живого игрока в выживании/приключении.
# В творческом режиме и наблюдении естественный спавн не запускается.
spawn-max-player-distance: 96
spawn-radius-chunks: 6
# Для враждебных мобов обычного мира: 0 соответствует темноте в 1.18+.
# Это уровень света БЛОКОВ; время суток и поверхность проверяются отдельно.
hostile-max-block-light: 0
# Коровы/овцы/свиньи/куры/лошади/ослы появляются на травяном блоке.
passive-require-grass: true
# Сохранять естественно появившихся наземных животных вдали от игроков.
despawn-passive: false

ai:
  pathfinding: true
  # A* только в загруженных чанках. Лестницы, плавание и полёт используют исходное поведение.
  repath-ticks: 20
  max-path-nodes: 192
  path-radius: 24
  paths-per-tick: 4
  # Общий временной бюджет поиска путей за тик, миллисекунды.
  path-budget-ms: 3.0

# Наложение на правила биома исходного плагина, а не принудительный спавн везде.
# Имена мобов без пробелов и подчёркиваний: zombievillager, tropicalfish и т.д.
# enabled, weight-multiplier (0 отключает), min-y, max-y, time: any/day/night,
# max-block-light, biomes: [точные имена биомов в нижнем регистре].
# group-min/max — для cow/sheep/pig/chicken и рыб/кальмаров, включая первого моба.
