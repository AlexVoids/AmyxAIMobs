# Поддерживаются: enabled, natural-spawning, per-world-*-cap, local-*-cap,
# spawn-chance-percent, spawn-min/max-player-distance, spawn-radius-chunks,
# hostile-max-block-light, entity-type-limits и mobs.
# Пример (раскомментируйте вместо world-overrides: {}):
# world-overrides:
#   lobby:
#     enabled: false
#   survival:
#     per-world-mob-cap: 70
#     spawn-chance-percent: 60
#     mobs:
#       creeper:
#         enabled: false
#       zombie:
#         weight-multiplier: 1.5
world-overrides: {}
