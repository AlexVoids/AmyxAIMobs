# AmyxAIMobs 1.0.1. После изменения: /aimobs reload
# Старые значения при обновлении сохраняются. 0 в лимите запрещает появление.
# Лимиты entity-type-limits считаются на весь сервер, остальные — по имени ключа.
natural-spawning: true
spawn-config-version: 12

spawn-cycle-seconds: 10
spawn-chance-percent: 42
spawn-chunks-per-player: 5
spawn-attempts-per-chunk: 2
spawn-successes-per-world: 3
spawn-min-player-distance: 24

structure-spawning: false
structure-scan-chunks-per-cycle: 3
structure-queue-per-second: 4
prepopulate-loaded-chunks: true
chunk-prepopulate-chance-percent: 14
structure-replenish-cycles: 50
always-tick-loaded-mobs: true
structure-respawn-seconds: 600

global-mob-cap: 135
per-world-mob-cap: 90
per-world-passive-cap: 40
per-world-hostile-cap: 38
local-mob-cap: 36
local-passive-cap: 16
local-hostile-cap: 16
local-mob-cap-radius: 48
natural-despawn-distance: 112

water-herd-spawning: true
per-world-aquatic-cap: 40
local-aquatic-cap: 20

explosion-block-damage: true
creeper-max-damage: 16.0

creative-egg-profile: "grouped-creeper-main"

auto-detect-worlds: true
worlds:
  "skyblock": "overworld"
  "normal": "overworld"
  "nether": "nether"
  "the_end": "the_end"

entity-type-limits:
  cow: 22
  mooshroom: 6
  pig: 18
  sheep: 26
  chicken: 26
  horse: 6
  donkey: 4
  mule: 0
  llama: 4
  traderllama: 0
